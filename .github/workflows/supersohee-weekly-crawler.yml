name: Supersohee weekly article crawler

on:
  schedule:
    # Tuesday 09:10 Asia/Seoul (00:10 UTC)
    - cron: "10 0 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supersohee-weekly-article-crawler
  cancel-in-progress: false

jobs:
  crawl-and-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out admin branch
        uses: actions/checkout@v4
        with:
          ref: admin

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: crawlers/requirements.txt

      - name: Install crawler dependencies
        run: python -m pip install --requirement crawlers/requirements.txt

      - name: Prepare private review directory
        run: sudo install -d -m 700 -o "$USER" -g "$(id -gn)" /private/tmp

      - name: Run crawler tests
        run: python -m unittest discover -s crawlers/tests

      - name: Validate crawler secrets
        env:
          SUPERSOHEE_BACKEND_URL: ${{ secrets.SUPERSOHEE_BACKEND_URL }}
          SUPERSOHEE_ARTICLE_IMPORT_KEY: ${{ secrets.SUPERSOHEE_ARTICLE_IMPORT_KEY }}
        run: |
          test -n "$SUPERSOHEE_BACKEND_URL"
          test -n "$SUPERSOHEE_ARTICLE_IMPORT_KEY"

      - name: Crawl and submit safe articles
        env:
          SUPERSOHEE_BACKEND_URL: ${{ secrets.SUPERSOHEE_BACKEND_URL }}
          SUPERSOHEE_ARTICLE_IMPORT_KEY: ${{ secrets.SUPERSOHEE_ARTICLE_IMPORT_KEY }}
        run: |
          umask 077
          python -m crawlers.supersohee_crawlers.cli \
            --source all \
            --max-pages 10 \
            --timeout 10 \
            --retries 2 \
            --pace-seconds 1 \
            --review-output /private/tmp/supersohee-weekly-review.json \
            --submit

      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supersohee-weekly-review-${{ github.run_id }}
          path: /private/tmp/supersohee-weekly-review.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify Slack when the crawler job fails
        if: ${{ failure() }}
        continue-on-error: true
        timeout-minutes: 1
        env:
          SLACK_ERROR_ALERTS_ENABLED: ${{ vars.SLACK_ERROR_ALERTS_ENABLED }}
          SLACK_ERROR_WEBHOOK_URL: ${{ secrets.SLACK_ERROR_WEBHOOK_URL }}
          SLACK_ERROR_JOB: crawl-and-submit
          SLACK_ERROR_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$SLACK_ERROR_ALERTS_ENABLED" != "true" ]; then
            exit 0
          fi
          if [ -z "$SLACK_ERROR_WEBHOOK_URL" ]; then
            exit 0
          fi
          case "$SLACK_ERROR_WEBHOOK_URL" in
            https://hooks.slack.com/services/*|https://hooks.slack-gov.com/services/*) ;;
            *) exit 0 ;;
          esac
          payload="$(python3 -c 'import json,os; print(json.dumps({"text": ":red_circle: Supersohee weekly crawler failed\\nJob: " + os.environ["SLACK_ERROR_JOB"] + "\\nRun: " + os.environ["SLACK_ERROR_RUN_URL"]}))')"
          curl --fail --silent --show-error --output /dev/null \
            --max-time 10 --retry 0 \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "$SLACK_ERROR_WEBHOOK_URL"
